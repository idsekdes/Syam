<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan | Syam Digital</title>
  <meta name="description" content="Halaman tidak ditemukan. Kembali ke beranda Syam Digital.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at 50% 30%, #0f172a, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 40px 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .error-code {
      font-size: clamp(80px, 18vw, 120px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      color: #0f172a;
      background: #38bdf8;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 99px;
      transition: all 0.2s ease;
    }

    .button:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #475569;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 16px;
      }
      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="brand">✦ SYAM DIGITAL</div>
    
    <div class="error-code">404</div>
    
    <h1>Halaman Tidak Ditemukan</h1>
    
    <p>
      Maaf, halaman yang Anda cari mungkin telah dipindahkan atau tidak lagi tersedia.
    </p>

    <a href="https://www.syams.web.id/" class="button">
      Kembali ke Beranda
    </a>

    <div class="footer">
      &copy; Syam Digital
    </div>
  </main>

</body>
</html>
